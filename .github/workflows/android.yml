name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data:
    name: Check map data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Reads the committed asset back and checks the outlines, the label
      # points, the facts and the accepted spellings. No network needed.
      - name: Validate world.bin
        working-directory: tools
        run: python3 check_data.py

  build:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/terraquiz.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            ALIAS="$KEY_ALIAS"; STOREPW="$STORE_PASSWORD"; KEYPW="$KEY_PASSWORD"
            echo "Signing with the keystore from repository secrets."
          else
            # No secrets configured: sign with a throwaway key so the APK still
            # installs. Every build then has a different signature, so uninstall
            # the previous build before installing a new one.
            ALIAS=terraquiz; STOREPW=terraquiz; KEYPW=terraquiz
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -storepass "$STOREPW" -keypass "$KEYPW" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Terraquiz CI, OU=Build, O=Terraquiz, C=ZZ"
            echo "No KEYSTORE_BASE64 secret: signed with a throwaway CI key."
          fi
          echo "::add-mask::$STOREPW"
          echo "::add-mask::$KEYPW"
          {
            echo "TQ_STORE_FILE=$KS"
            echo "TQ_STORE_PASSWORD=$STOREPW"
            echo "TQ_KEY_ALIAS=$ALIAS"
            echo "TQ_KEY_PASSWORD=$KEYPW"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PtqStoreFile="$TQ_STORE_FILE" \
            -PtqStorePassword="$TQ_STORE_PASSWORD" \
            -PtqKeyAlias="$TQ_KEY_ALIAS" \
            -PtqKeyPassword="$TQ_KEY_PASSWORD"

      - name: Report size
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SIZE=$(stat -c%s "$APK")
          echo "### APK: $(basename "$APK") - $((SIZE / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| entry | compressed |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | sort -rn | head -8 \
            | awk '{printf "| %s | %s bytes |\n", $4, $1}' >> "$GITHUB_STEP_SUMMARY"
          # The whole point of the build is that this stays tiny.
          LIMIT=$((1536 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "APK grew to $SIZE bytes, over the $LIMIT byte budget." >&2
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: terraquiz-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "$APK_PATH" --generate-notes
